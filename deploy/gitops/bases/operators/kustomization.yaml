apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../../flux-system
patches:
- patch: "apiVersion: fluxcd.controlplane.io/v1\nkind: FluxInstance\nmetadata:\n \
    \ name: flux\n  namespace: flux-system\n$patch: delete\n"
- patch: "apiVersion: helm.toolkit.fluxcd.io/v2\nkind: HelmRelease\nmetadata:\n  name:\
    \ openbao\n  namespace: shared-services\n$patch: delete\n"
- patch: "apiVersion: helm.toolkit.fluxcd.io/v2\nkind: HelmRelease\nmetadata:\n  name:\
    \ c5c3-operator\n  namespace: c5c3-system\n$patch: delete\n"
- target:
    kind: Namespace
  patch: "apiVersion: v1\nkind: Namespace\nmetadata:\n  name: patch-target\n  annotations:\n\
    \    kustomize.toolkit.fluxcd.io/prune: disabled\n"
