apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: envoy-nodeport
    namespace: envoy-gateway-system
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: openstack-gw
  namespace: openstack
spec:
  gatewayClassName: envoy
  listeners:
  - name: https
    protocol: HTTPS
    port: 443
    hostname: keystone.127-0-0-1.nip.io
    tls:
      mode: Terminate
      certificateRefs:
      - kind: Secret
        name: keystone-nip-io-tls
    allowedRoutes:
      namespaces:
        from: Same
  - name: https-horizon
    protocol: HTTPS
    port: 443
    hostname: horizon.127-0-0-1.nip.io
    tls:
      mode: Terminate
      certificateRefs:
      - kind: Secret
        name: horizon-nip-io-tls
    allowedRoutes:
      namespaces:
        from: Same
