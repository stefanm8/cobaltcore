apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cobaltcore-bootstrap
  namespace: openstack
rules:
- apiGroups:
  - c5c3.io
  resources:
  - controlplanes
  verbs:
  - get
- apiGroups:
  - k8s.mariadb.com
  resources:
  - mariadbs
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ''
  resources:
  - secrets
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cobaltcore-bootstrap
  namespace: openstack
subjects:
- kind: ServiceAccount
  name: cobaltcore-bootstrap
  namespace: shared-services
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cobaltcore-bootstrap
